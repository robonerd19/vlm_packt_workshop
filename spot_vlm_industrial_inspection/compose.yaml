# Inference is Ollama serving qwen2.5vl:3b from the model volume shared by all workshop projects.
x-ros: &ros
  image: spot-inspection-ros:local
  build: .
  network_mode: host
  ipc: host
  init: true
  environment: &ros-env
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-91}
    RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    FASTDDS_BUILTIN_TRANSPORTS: UDPv4
    GZ_IP: 127.0.0.1  # gz-transport on loopback; see sim.launch.py

services:
  inference:
    image: ollama/ollama:0.40.10
    network_mode: host
    init: true
    mem_limit: ${INFERENCE_MEMORY:-6g}
    memswap_limit: ${INFERENCE_MEMORY:-6g}
    volumes:
      - ollama:/root/.ollama
    environment:
      # Host networking: bind to localhost only, on the port the application expects.
      OLLAMA_HOST: 127.0.0.1:8081
      OLLAMA_KEEP_ALIVE: '-1'
      OLLAMA_NUM_PARALLEL: '1'
      # With the default f16 K/V cache, qwen2.5vl on CUDA (Ollama 0.40.10/0.40.11) degenerated
      # into "GGGG..." answers and stayed broken until restart; a q8_0 cache (needs flash attention) did not.
      OLLAMA_FLASH_ATTENTION: '1'
      OLLAMA_KV_CACHE_TYPE: q8_0
    # First start pulls the model (3.2 GB) and names it "vlm", the name the code asks for.
    # Loading it before reporting healthy: the first request to a cold model took minutes.
    entrypoint: [/bin/sh, -c]
    command:
      - (until ollama list >/dev/null 2>&1; do sleep 1; done;
         ollama show vlm >/dev/null 2>&1 || { ollama pull qwen2.5vl:3b && ollama cp qwen2.5vl:3b vlm; };
         ollama run vlm 'Say ok.' >/dev/null) &
        exec ollama serve
    healthcheck:
      test: [CMD-SHELL, ollama ps | grep -q '^vlm']
      interval: 10s
      timeout: 5s
      start_period: 30m
      retries: 3

  simulation:
    <<: *ros
    shm_size: 1gb
    environment:
      <<: *ros-env
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/spot.xauthority
      QT_QPA_PLATFORM: xcb
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${HOST_XAUTHORITY:-/dev/null}:/tmp/spot.xauthority:ro
    command: [bash, -lc, 'source /spot_ws/install/setup.bash && ros2 launch spot_inspection_sim sim.launch.py']

  inspector:
    <<: *ros
    profiles: [inspect]
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}  # reports belong to the host user, not root
    environment:
      <<: *ros-env
      HOME: /tmp
      ROS_LOG_DIR: /tmp/ros_logs
    depends_on:
      inference:
        condition: service_healthy
    volumes:
      - ./reports:/reports
    command: [bash, -lc, 'source /spot_ws/install/setup.bash && ros2 launch spot_inspection inspection.launch.py report_dir:=/reports']

volumes:
  ollama:
    name: vlm-workshop-ollama  # shared by all four workshop projects
