# NVIDIA overlay: CUDA inference and GPU rendering for Gazebo.
services:
  inference:
    image: vlm-workshop-inference-cuda:local
    build:
      context: ../turtlebot4_vla_object_finder
      dockerfile: docker/inference.cuda.Dockerfile
      args:
        CUDA_ARCHITECTURES: ${CUDA_ARCHITECTURES:-89}
        BUILD_JOBS: ${GPU_BUILD_JOBS:-4}
    command: [gpu]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
  simulation:
    environment:
      LIBGL_ALWAYS_SOFTWARE: '0'
      NVIDIA_DRIVER_CAPABILITIES: all
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
