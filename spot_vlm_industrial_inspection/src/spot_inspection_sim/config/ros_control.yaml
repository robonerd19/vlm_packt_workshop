controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 250
    joint_states_controller:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_group_position_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_group_position_controller:
  ros__parameters:
    use_sim_time: true
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: true
    state_publish_rate: 100.0
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
    joints:
      - front_left_hip_x
      - front_left_hip_y
      - front_left_knee
      - front_right_hip_x
      - front_right_hip_y
      - front_right_knee
      - rear_left_hip_x
      - rear_left_hip_y
      - rear_left_knee
      - rear_right_hip_x
      - rear_right_hip_y
      - rear_right_knee
