# NVIDIA overlay: GPU inference and GPU rendering for Gazebo.
services:
  inference:
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
  simulation:
    environment:
      LIBGL_ALWAYS_SOFTWARE: '0'
      NVIDIA_DRIVER_CAPABILITIES: all
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
