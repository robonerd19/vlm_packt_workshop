x-ros: &ros
  image: franka-vlm-ros:local
  build:
    context: .
    dockerfile: docker/ros.Dockerfile
  network_mode: host
  init: true
  environment: &ros-env
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-78}
    RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    FASTDDS_BUILTIN_TRANSPORTS: UDPv4
  shm_size: 64m
  stop_grace_period: 20s
services:
  inference:
    image: vlm-workshop-inference:local
    build:
      context: .
      dockerfile: docker/inference.Dockerfile
    network_mode: host
    init: true
    mem_limit: ${INFERENCE_MEMORY:-3g}
    volumes:
      - ${MODEL_DIR:-./models}:/models:ro
    environment:
      CPU_THREADS: ${CPU_THREADS:-4}
      GPU_LAYERS: ${GPU_LAYERS:-999}
    command: [cpu]
    healthcheck:
      test: [CMD, curl, -fsS, 'http://127.0.0.1:8081/health']
      interval: 10s
      timeout: 3s
      start_period: 120s
      retries: 12
  simulation:
    <<: *ros
    mem_limit: ${SIMULATION_MEMORY:-2g}
    environment:
      <<: *ros-env
      SOFTWARE_RENDERING: ${SOFTWARE_RENDERING:-1}
    command: [ros2, launch, vlm_pick_place, sim.launch.py]
  application:
    <<: *ros
    mem_limit: ${APPLICATION_MEMORY:-768m}
    depends_on:
      inference:
        condition: service_healthy
      simulation:
        condition: service_started
    command: [ros2, launch, vlm_pick_place, app.launch.py, 'web_port:=${WEB_PORT:-8000}']
    healthcheck:
      test: [CMD, curl, -fsS, 'http://127.0.0.1:${WEB_PORT:-8000}/status']
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 12
