x-ros: &ros
  image: franka-vlm-ros:local
  build:
    context: .
    dockerfile: docker/ros.Dockerfile
  network_mode: host
  init: true
  environment: &ros-env
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-78}
    RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    FASTDDS_BUILTIN_TRANSPORTS: UDPv4
  shm_size: 64m
  stop_grace_period: 20s
services:
  inference:
    image: ollama/ollama:0.40.10
    network_mode: host
    init: true
    mem_limit: ${INFERENCE_MEMORY:-6g}
    memswap_limit: ${INFERENCE_MEMORY:-6g}
    volumes:
      - ollama:/root/.ollama
    environment:
      # Host networking: bind to localhost only, on the port the application expects.
      OLLAMA_HOST: 127.0.0.1:8081
      OLLAMA_KEEP_ALIVE: '-1'
      OLLAMA_NUM_PARALLEL: '1'
      # With the default f16 K/V cache, qwen2.5vl on CUDA (Ollama 0.40.10/0.40.11) degenerated
      # into "GGGG..." answers and stayed broken until restart; a q8_0 cache (needs flash attention) did not.
      OLLAMA_FLASH_ATTENTION: '1'
      OLLAMA_KV_CACHE_TYPE: q8_0
    # First start pulls the model (3.2 GB) and names it "vlm", the name the code asks for.
    # Loading it before reporting healthy: the first request to a cold model took minutes.
    entrypoint: [/bin/sh, -c]
    command:
      - (until ollama list >/dev/null 2>&1; do sleep 1; done;
         ollama show vlm >/dev/null 2>&1 || { ollama pull qwen2.5vl:3b && ollama cp qwen2.5vl:3b vlm; };
         ollama run vlm 'Say ok.' >/dev/null) &
        exec ollama serve
    healthcheck:
      test: [CMD-SHELL, ollama ps | grep -q '^vlm']
      interval: 10s
      timeout: 5s
      start_period: 30m
      retries: 3
  simulation:
    <<: *ros
    mem_limit: ${SIMULATION_MEMORY:-2g}
    environment:
      <<: *ros-env
      SOFTWARE_RENDERING: ${SOFTWARE_RENDERING:-1}
    command: [ros2, launch, vlm_pick_place, sim.launch.py]
  application:
    <<: *ros
    mem_limit: ${APPLICATION_MEMORY:-768m}
    depends_on:
      inference:
        condition: service_healthy
      simulation:
        condition: service_started
    command: [ros2, launch, vlm_pick_place, app.launch.py, 'web_port:=${WEB_PORT:-8000}']
    healthcheck:
      test: [CMD, curl, -fsS, 'http://127.0.0.1:${WEB_PORT:-8000}/status']
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 12
volumes:
  ollama:
    name: vlm-workshop-ollama  # shared by all four workshop projects
