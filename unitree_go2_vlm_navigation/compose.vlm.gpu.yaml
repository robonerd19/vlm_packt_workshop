services:
  inference:
    image: vlm-workshop-inference-cuda:local
    build:
      context: ../turtlebot4_vla_object_finder
      dockerfile: docker/inference.cuda.Dockerfile
      args:
        CUDA_ARCHITECTURES: ${CUDA_ARCHITECTURES:-89}
    command: [gpu]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
