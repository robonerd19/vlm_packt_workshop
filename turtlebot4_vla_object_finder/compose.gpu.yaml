# Use with compose.yaml. scripts/run_demo.sh selects this when --device gpu is set.
services:
  inference:
    image: vlm-workshop-inference-cuda:local
    build:
      context: .
      dockerfile: docker/inference.cuda.Dockerfile
      args:
        CUDA_ARCHITECTURES: ${CUDA_ARCHITECTURES:-89}
        BUILD_JOBS: ${GPU_BUILD_JOBS:-2}
    command: [gpu]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
