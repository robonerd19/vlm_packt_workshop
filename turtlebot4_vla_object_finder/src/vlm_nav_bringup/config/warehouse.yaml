vlm_navigator:
  ros__parameters:
    inference_url: http://127.0.0.1:8081
    inference_timeout: 120.0
    image_width: 320
    max_new_tokens: 128
    approach_distance: 1.0
    nav_timeout: 180.0
    verify_detection: true
    search_enabled: true
    search_map_enabled: true
    search_headings: 36
    search_rotation_delay: 1.0
    search_locations: 3
    search_spacing: 3.0
    search_clearance: 0.45
    search_timeout: 900.0
    home_x: -3.0
    home_y: -1.0
    sensor_max_age: 2.0
    lifecycle_nodes: [amcl, planner_server, controller_server, bt_navigator]
vlm_web:
  ros__parameters:
    bind: 127.0.0.1
    port: 8000
    request_timeout: 1200.0
